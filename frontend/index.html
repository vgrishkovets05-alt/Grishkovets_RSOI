<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Handmade Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <div class="header-left">
        <h1>Handmade Shop</h1>
    </div>
    <div class="header-center">
        <button onclick="showHome()">Главная</button>
        <button onclick="loadCart()">Корзина</button>
        <button onclick="showReviews()">Отзывы</button>
    </div>
    <div class="header-right" id="userArea">
        <!-- Здесь будут кнопки Вход/Регистрация или имя пользователя -->
    </div>
</header>

<main id="mainContent" class="container">
    <p>Добро пожаловать в магазин изделий ручной работы</p>
</main>

<script src="js/app.js"></script>
</body>
</html>
